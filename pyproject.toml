[project]
name = "music-vae-study"
version = "0.1.0"
description = "Reproducible audit and held-out evaluation of music VAE representations"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "torch", "matplotlib", "joblib"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["musicvae*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
